name: Build and backend checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest backend.test_workflow -v
      - run: npm --prefix frontend/react-app ci
      - run: npm --prefix frontend/react-app run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-production-build
          path: frontend/react-app/dist
